name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # AltiumSharp's writer (OriginalCircuit.Altium) targets net10.0-windows-compatible APIs
    # and the CLI is a Windows tool per the README; build on windows-latest to match.
    runs-on: windows-latest
    steps:
      - name: Check out YouEDA-CLI
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Clone AltiumSharp
        run: git clone https://github.com/issus/AltiumSharp.git third_party/AltiumSharp

      - name: Pin AltiumSharp to the README-documented commit
        working-directory: third_party/AltiumSharp
        run: git checkout ce72437f30cd54f549601d4e0ca5846d21272150

      - name: Initialize AltiumSharp submodules
        working-directory: third_party/AltiumSharp
        run: git submodule update --init --recursive

      - name: Apply AltiumSharp patches
        working-directory: third_party/AltiumSharp
        run: |
          git apply ../../patches/altium-native-symbol-coordinates.patch
          git apply ../../patches/altium-sdk-sourcelink.patch

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release
